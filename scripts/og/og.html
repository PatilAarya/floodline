<!doctype html>
<!--
  Source of public/og.png (the link-preview image), 1200 x 630.
  Rebuild with:  npm run og   (screenshots this page with your local Chrome or Edge, headless)
  Uses only the five colour tokens and the self-hosted fonts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; font-weight: 800; src: url('../../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Instrument Sans'; font-weight: 400; src: url('../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
      :root { --text: #101816; --background: #f9fbfb; --primary: #6c998d; --secondary: #a8b1c2; --accent: #8a8ead; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--background); color: var(--text); }
      .frame { position: relative; width: 1200px; height: 630px; }
      .art { position: absolute; inset: 0; }
      .copy { position: absolute; left: 84px; top: 92px; width: 640px; }
      .eyebrow { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in oklab, var(--text) 66%, var(--background)); margin: 0 0 22px; }
      h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 150px; line-height: 0.9; letter-spacing: -0.045em; margin: 0 0 34px; }
      p.lede { font-family: 'Instrument Sans', sans-serif; font-size: 32px; line-height: 1.35; margin: 0; max-width: 600px; }
      .rule { position: absolute; left: 84px; width: 700px; bottom: 70px; height: 1px; background: color-mix(in oklab, var(--text) 18%, transparent); }
      .foot { position: absolute; left: 84px; bottom: 30px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 18px; color: color-mix(in oklab, var(--text) 60%, var(--background)); }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg class="art" viewBox="0 0 1200 630" aria-hidden="true">
        <defs>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="color-mix(in oklab, var(--accent) 45%, var(--background))" />
            <stop offset="1" stop-color="color-mix(in oklab, var(--primary) 75%, var(--text))" />
          </linearGradient>
          <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M0 0v9" stroke="var(--text)" stroke-opacity="0.18" stroke-width="1.4" />
          </pattern>
        </defs>
        <!-- contours of a basin on the right -->
        <g fill="none" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1.3">
          <path d="M760 -10 C 820 120, 980 150, 1210 110" />
          <path d="M740 40 C 820 190, 990 210, 1210 180" />
          <path d="M760 110 C 840 250, 1000 270, 1210 250" />
          <path d="M800 190 C 870 300, 1010 330, 1210 320" />
        </g>
        <!-- hatched risk band and the rising water -->
        <path d="M850 640 C 820 480, 860 340, 1000 325 C 1090 316, 1160 322, 1210 330 L1210 640 Z" fill="url(#hatch)" />
        <path d="M890 640 C 870 540, 900 445, 1010 425 C 1090 412, 1150 410, 1210 405 L1210 640 Z" fill="url(#water)" opacity="0.85" />
        <g fill="none" stroke="var(--background)" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
          <path d="M930 480 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0" />
          <path d="M950 540 q26 -10 52 0 t52 0 t52 0 t52 0 t52 0" opacity="0.6" />
        </g>
        <!-- a road that goes under: solid, then broken -->
        <path d="M790 120 C 880 200, 930 260, 985 330" fill="none" stroke="var(--text)" stroke-width="7" stroke-linecap="round" />
        <path d="M993 342 C 1030 390, 1065 425, 1110 465" fill="none" stroke="var(--text)" stroke-width="5" stroke-dasharray="14 12" />
        <!-- the shelter arch on high ground -->
        <g transform="translate(1000 108)">
          <path d="M-38 54 V18 a38 38 0 0 1 76 0 V54" fill="none" stroke="var(--text)" stroke-width="11" stroke-linecap="round" />
          <path d="M-58 54 H58" stroke="var(--text)" stroke-width="7" stroke-linecap="round" />
        </g>
        <!-- the re-planned route, to the shelter -->
        <path d="M800 330 C 870 280, 920 220, 990 168" fill="none" stroke="color-mix(in oklab, var(--primary) 80%, var(--text))" stroke-width="6" stroke-linecap="round" />
        <circle cx="800" cy="330" r="10" fill="var(--text)" />
        <circle cx="800" cy="330" r="4" fill="var(--background)" />
      </svg>
      <div class="copy">
        <p class="eyebrow">Flood evacuation planner · Mumbai</p>
        <h1>Floodline</h1>
        <p class="lede">Navigation apps assume the road network is fixed. Floodline handles roads that disappear and risk that is uncertain.</p>
      </div>
      <div class="rule"></div>
      <div class="foot">A* re-planning · BFS · DFS · UCS · Greedy · Bayes</div>
    </div>
  </body>
</html>
